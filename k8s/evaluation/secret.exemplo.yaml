# MODELO — gerar no deploy.
#   REDIS_URL:       echo -n 'redis://endpoint-elasticache:6379' | base64 -w0
#   SERVICE_API_KEY: chave criada em runtime pelo auth-service (POST /admin/keys)
#   AWS_SQS_URL:     URL da fila criada na etapa 2
apiVersion: v1
kind: Secret
metadata: { name: evaluation-secrets, namespace: evaluation }
type: Opaque
data:
  REDIS_URL:       BASE64_DA_URL_DO_ELASTICACHE
  SERVICE_API_KEY: BASE64_DA_CHAVE_DE_SERVICO
  AWS_SQS_URL:     BASE64_DA_URL_DA_FILA_SQS
