# MODELO — não versionar com valores reais. Gerar no momento do deploy.
# O enunciado exige as secrets em base64, então usamos 'data' (e não 'stringData').
#   echo -n 'postgres://user:senha@endpoint-rds:5432/auth_db' | base64 -w0
apiVersion: v1
kind: Secret
metadata: { name: auth-secrets, namespace: auth }
type: Opaque
data:
  DATABASE_URL: BASE64_DA_CONNECTION_STRING_DO_RDS
  MASTER_KEY:   BASE64_DA_MASTER_KEY
